<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
    }
   
    .product{
        padding: 10px;
        margin: 10px 0;
        border-radius: 20px;
        display: inline-block;
        align-items: center;
        background-color: #f9f9f9;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .product img{
        width: 300px;
        height: 300px;
        margin-right: 10px;
    }
</style>
</style>
<body>
    <div class="container">
        <div class="product">
            <img src={{img}} alt="img">
            <p>{{product}}</p>
            <p>{{description}}</p>
            <p>{{price}}</p>
        </div>
    </div>
</body>
</html>
